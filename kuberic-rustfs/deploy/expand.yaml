apiVersion: v1
kind: ConfigMap
metadata:
  name: rustfs-node-b
  namespace: rustfs-example
data:
  node.json: |
    {
      "binary": "/usr/local/bin/rustfs",
      "sha256": "e6544a42a09a16d6fea47ad3d8aaa1a8793c9afa9c723bb8ae884f1238cd7c25",
      "credentials": {
        "access_key": "/credentials/access-key",
        "secret_key": "/credentials/secret-key"
      },
      "state_directory": "/storage/adapter",
      "topology": {
        "pools": [
          "https://rfs-a-{0...3}.rustfs-internal:9000/storage/data",
          "https://rfs-b-{0...3}.rustfs-internal:9000/storage/data"
        ],
        "local_node": null,
        "erasure_set_drive_count": 4
      },
      "native_address": "0.0.0.0:9000",
      "client_address": "0.0.0.0:9002",
      "control_address": "0.0.0.0:9003",
      "control_token_file": "/credentials/control-token",
      "native_tls": {"directory": "/tls"},
      "control_tls": {
        "certificate_file": "/tls/rustfs_cert.pem",
        "private_key_file": "/tls/rustfs_key.pem"
      },
      "shutdown_grace_seconds": 10
    }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rfs-b
  namespace: rustfs-example
spec:
  replicas: 4
  serviceName: rustfs-internal
  podManagementPolicy: Parallel
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app.kubernetes.io/name: rustfs
      rustfs-pool: b
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rustfs
        rustfs-pool: b
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
        kubernetes.io/arch: amd64
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  rustfs-pool: b
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      initContainers:
        - name: directories
          image: kuberic-rustfs:local
          imagePullPolicy: IfNotPresent
          command: ["/bin/mkdir", "-p", "/storage/adapter", "/storage/data"]
          volumeMounts:
            - name: storage
              mountPath: /storage
      containers:
        - name: adapter
          image: kuberic-rustfs:local
          imagePullPolicy: IfNotPresent
          args: ["serve", "--config", "/config/node.json", "--local-node", "https://$(POD_NAME).rustfs-internal:9000"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: native
              containerPort: 9000
            - name: s3
              containerPort: 9002
            - name: control
              containerPort: 9003
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /ready
              port: control
            periodSeconds: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /live
              port: control
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /live
              port: control
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: config
              mountPath: /config
              readOnly: true
            - name: credentials
              mountPath: /credentials
              readOnly: true
            - name: temporary
              mountPath: /tmp
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: rustfs-node-b
        - name: credentials
          secret:
            secretName: rustfs-credentials
            defaultMode: 0440
        - name: temporary
          emptyDir: {}
        - name: tls
          secret:
            secretName: rustfs-tls
            defaultMode: 0440
            items:
              - key: tls.crt
                path: rustfs_cert.pem
              - key: tls.key
                path: rustfs_key.pem
              - key: ca.crt
                path: ca.crt
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi
