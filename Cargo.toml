[workspace]
resolver = "2"
members = ["kuberic-page", "kuberic-reliable-collections"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic-apps"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
fs2 = "0.4"
futures = "0.3"
kuberic-runtime = "=0.0.1"
postcard = { version = "1", features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
