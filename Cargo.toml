[workspace]
resolver = "2"
members = [
  "kuberic-page",
  "kuberic-rocksdb",
  "rustfs-native",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/youyuanwu/kuberic-apps"
rust-version = "1.85"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
crc32fast = "1"
fs2 = "0.4"
futures = "0.3"
kuberic-runtime = "=0.0.1"
postcard = { version = "1", features = ["alloc"] }
rocksdb = { version = "=0.24.0", default-features = false, features = ["bindgen-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"
