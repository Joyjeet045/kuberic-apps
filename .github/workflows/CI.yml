name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runtime: [published, main]
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7

      - name: Check out current framework
        if: matrix.runtime == 'main'
        uses: actions/checkout@v7
        with:
          repository: youyuanwu/kuberic
          path: framework

      - name: Select current framework runtime
        if: matrix.runtime == 'main'
        run: |
          mkdir -p "$HOME/.cargo"
          printf '\n[patch.crates-io]\nkuberic-runtime = { path = "%s/framework/kuberic-runtime" }\n' "$GITHUB_WORKSPACE" >> "$HOME/.cargo/config.toml"

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          build-warnings: ""

      - uses: taiki-e/install-action@protoc

      - name: Install RocksDB build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets --all-features

      - name: Lint workspace
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace --all-features -- --test-threads=2
