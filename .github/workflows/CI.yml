name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      rustfs_e2e:
        description: Build the pinned native image and run the isolated RustFS cluster suite
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          components: rustfmt, clippy
          build-warnings: ""

      - uses: taiki-e/install-action@protoc

      - name: Install RocksDB build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --locked --workspace --all-targets --all-features

      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace --all-features -- --test-threads=2

  rustfs-native-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.rustfs_e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install pinned kind
        run: |
          curl --fail --location --output "$RUNNER_TEMP/kind" https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          printf '%s  %s\n' aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d "$RUNNER_TEMP/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build and test pinned Linux native artifacts
        run: docker build --file kuberic-rustfs/Dockerfile --tag kuberic-rustfs:e2e .

      - name: Validate native quorum, recovery, fencing and topology
        shell: pwsh
        run: ./kuberic-rustfs/tests/e2e.ps1 -Image kuberic-rustfs:e2e
